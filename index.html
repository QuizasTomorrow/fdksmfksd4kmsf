<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hola</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            font-family: "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at 50% 35%, #4b376b 0%, #211a38 45%, #100d1e 100%);
            color: white;
            cursor: pointer;
        }

        .stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;
            opacity: .6;
            animation: brillo 2s infinite alternate;
        }

        @keyframes brillo {
            from {
                opacity: .2;
                transform: scale(.7);
            }

            to {
                opacity: 1;
                transform: scale(1.3);
            }
        }

        .pantalla {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            z-index: 2;
            padding: 20px;
        }

        .contenido {
            transition: 1s ease;
        }

        .hola {
            font-size: 18px;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #ddd;
            margin-bottom: 15px;
        }

        h1 {
            font-family: Georgia, serif;
            font-size: clamp(55px, 12vw, 100px);
            color: #ffe15c;
            text-shadow:
                0 0 15px rgba(255, 220, 70, .5),
                0 0 40px rgba(255, 220, 70, .2);
        }

        .instruccion {
            margin-top: 25px;
            font-size: 15px;
            color: #bbb;
            animation: aparecer 2s ease infinite alternate;
        }

        @keyframes aparecer {
            from {
                opacity: .4;
            }

            to {
                opacity: 1;
            }
        }

        .mensaje {
            display: none;
            animation: aparecerMensaje 1.5s ease forwards;
        }

        @keyframes aparecerMensaje {
            from {
                opacity: 0;
                transform: translateY(30px) scale(.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .flor {
            font-size: 110px;
            display: inline-block;
            filter: drop-shadow(0 0 20px rgba(255, 220, 50, .5));
            animation: flor 3s ease-in-out infinite;
            margin-bottom: 15px;
        }

        @keyframes flor {
            0%, 100% {
                transform: rotate(-5deg) translateY(0);
            }

            50% {
                transform: rotate(5deg) translateY(-12px);
            }
        }

        .mensaje h2 {
            font-family: Georgia, serif;
            font-size: clamp(32px, 7vw, 55px);
            color: #ffe15c;
            margin-bottom: 20px;
        }

        .mensaje p {
            max-width: 600px;
            font-size: 19px;
            line-height: 1.8;
            color: #eee;
        }

        .detalle {
            margin-top: 25px;
            color: #ffe15c;
            font-size: 15px;
        }

        .flor-caida {
            position: fixed;
            top: -50px;
            pointer-events: none;
            z-index: 1;
            animation: caer linear forwards;
        }

        @keyframes caer {
            0% {
                transform: translateY(-50px) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: .8;
            }

            100% {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }

        .click {
            position: fixed;
            pointer-events: none;
            font-size: 22px;
            animation: clickAnim 1.5s ease forwards;
            z-index: 10;
        }

        @keyframes clickAnim {
            0% {
                transform: scale(.5);
                opacity: 0;
            }

            30% {
                transform: scale(1.2);
                opacity: 1;
            }

            100% {
                transform: translateY(-80px) scale(1);
                opacity: 0;
            }
        }

        @media(max-width:600px) {

            .hola {
                font-size: 14px;
            }

            .flor {
                font-size: 80px;
            }

            .mensaje p {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="stars" id="stars"></div>

    <main class="pantalla" onclick="mostrarMensaje(event)">

        <!-- PRIMERA PANTALLA -->

        <div class="contenido" id="inicio">

            <div class="hola">
                Una pequeña sorpresa...
            </div>

            <h1>
                Hola, Ariana
            </h1>

            <div class="instruccion">
                Haz clic en cualquier parte de la pantalla
            </div>

        </div>


        <!-- MENSAJE DESPUÉS DEL CLICK -->

        <div class="mensaje" id="mensaje">

            <div class="flor">
                🌻
            </div>

            <h2>
                Esta flor es para ti
            </h2>

        

            <p>
                Gracias por tu valiosa amistad ,te quiero mucho . 💛
            </p>


        </div>

    </main>


    <script>

        // Crear estrellas

        const estrellas = document.getElementById("stars");

        for (let i = 0; i < 100; i++) {

            const estrella = document.createElement("div");

            estrella.classList.add("star");

            estrella.style.left =
                Math.random() * 100 + "%";

            estrella.style.top =
                Math.random() * 75 + "%";

            estrella.style.animationDelay =
                Math.random() * 3 + "s";

            estrellas.appendChild(estrella);
        }


        // Mostrar mensaje

        let abierto = false;

        function mostrarMensaje(event) {

            if (abierto) {

                crearClick(event);

                return;
            }

            abierto = true;

            document.getElementById("inicio").style.display =
                "none";

            document.getElementById("mensaje").style.display =
                "block";

            crearClick(event);

            crearFlores();

        }


        // Efecto donde se hizo click

        function crearClick(event) {

            const efecto =
                document.createElement("div");

            efecto.classList.add("click");

            efecto.innerHTML = "✨";

            efecto.style.left =
                event.clientX + "px";

            efecto.style.top =
                event.clientY + "px";

            document.body.appendChild(efecto);

            setTimeout(() => {
                efecto.remove();
            }, 1500);
        }


        // Flores cayendo

        function crearFlor() {

            const flor =
                document.createElement("div");

            flor.classList.add("flor-caida");

            flor.innerHTML =
                Math.random() > .4 ? "🌻" : "🌼";

            flor.style.left =
                Math.random() * 100 + "vw";

            flor.style.fontSize =
                (18 + Math.random() * 25) + "px";

            flor.style.animationDuration =
                (5 + Math.random() * 5) + "s";

            document.body.appendChild(flor);

            setTimeout(() => {
                flor.remove();
            }, 10000);
        }


        function crearFlores() {

            for (let i = 0; i < 15; i++) {

                setTimeout(() => {
                    crearFlor();
                }, i * 200);

            }

        }


        setInterval(crearFlor, 1200);

    </script>

</body>
</html>
